<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Lens Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    font-family: 'Google Sans', 'Inter', system-ui, -apple-system, sans-serif;
  }

  /* Canvas sits on top of everything — crosshair cursor */
  #canvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: crosshair;
    opacity: 0;
    animation: overlayFadeIn 200ms ease forwards;
  }
  @keyframes overlayFadeIn {
    to { opacity: 1; }
  }

  /* ── Top Pill ─────────────────────────────────────────────────────────── */
  #top-pill {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-24px);
    opacity: 0;
    animation: pillSlideDown 260ms cubic-bezier(0.4, 0, 0.2, 1) 120ms forwards;

    background: #ffffff;
    color: #1f1f1f;
    border-radius: 100px;
    padding: 10px 20px 10px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
    font-size: 14px;
    font-weight: 500;
    pointer-events: auto;
    z-index: 200;
    white-space: nowrap;
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes pillSlideDown {
    to {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  }
  #top-pill.hidden { opacity: 0 !important; pointer-events: none; }

  #pill-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  #pill-text {
    flex: 1;
  }

  #pill-close {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5f6368;
    font-size: 18px;
    line-height: 1;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }
  #pill-close:hover { background: rgba(0,0,0,0.08); }

  /* ── Center Drag Tooltip ──────────────────────────────────────────────── */
  #center-tooltip {
    position: fixed;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(30, 30, 30, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #ffffff;
    border-radius: 16px;
    padding: 14px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    font-size: 14px;
    font-weight: 500;
    z-index: 150;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #center-tooltip.hidden { opacity: 0 !important; }

  #center-tooltip img {
    width: 32px;
    height: 32px;
  }

  /* ── Cursor Follower Hint ─────────────────────────────────────────────── */
  #cursor-hint {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 250;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    padding: 6px 12px 6px 8px;
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    font-size: 12px;
    font-weight: 500;
    color: #202124;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.05s linear;
    white-space: nowrap;
  }
  #cursor-hint.visible { opacity: 1; }
  #cursor-hint img { width: 18px; height: 18px; }

  /* ── Selection context menu ───────────────────────────────────────────── */
  #selection-menu {
    position: fixed;
    display: none;
    background: #ffffff;
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    z-index: 300;
    gap: 4px;
    align-items: center;
  }
  #selection-menu.visible {
    display: flex;
    animation: menuPop 180ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes menuPop {
    from { opacity: 0; transform: translateY(8px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .menu-btn {
    background: transparent;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    color: #202124;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease;
  }
  .menu-btn:hover { background: #f1f3f4; }
  .menu-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
</style>
</head>
<body>

<!-- Canvas: renders screenshot + dim + selection box -->
<canvas id="canvas"></canvas>

<!-- Top Pill — Google Lens branding -->
<div id="top-pill">
  <img id="pill-icon" src="../../assets/tray-icon.png" alt="Google Lens">
  <span id="pill-text">אפשר לבחור טקסט או תמונה לחיפוש באמצעות Google Lens</span>
  <button id="pill-close" title="סגור (Esc)">×</button>
</div>

<!-- Center Drag Tooltip -->
<div id="center-tooltip">
  <img src="../../assets/tray-icon.png" alt="Lens Icon">
  <span>צריך לגרור כדי לחפש</span>
</div>

<!-- Cursor Follower Hint -->
<div id="cursor-hint">
  <img src="../../assets/tray-icon.png" alt="Lens Icon">
  <span>צריך לגרור כדי לחפש</span>
</div>

<!-- Post-selection action menu -->
<div id="selection-menu">
  <button class="menu-btn" id="copy-text-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
    <span>העתקת הטקסט</span>
  </button>
  <button class="menu-btn" id="translate-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <path d="M5 8l6 6M4 14l6-6M2 5h12M9 2v3M16 11l4 9M22 20h-6"/>
    </svg>
    <span>תרגום</span>
  </button>
  <button class="menu-btn" id="copy-img-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <span>העתקת התמונה</span>
  </button>
</div>

<script src="overlay-renderer.js"></script>
</body>
</html>
